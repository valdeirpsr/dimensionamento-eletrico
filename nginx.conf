server {
    listen 80;
    listen [::]:80;
    server_name 0.0.0.0;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para otimização de transferência
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json font/woff font/woff2 image/svg+xml;

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker e Web App Manifest nunca devem ficar em cache imutável
    location ~* ^/(?:sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    # Cache de arquivos estáticos gerados pelo Vite
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
